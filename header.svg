<svg xmlns="http://www.w3.org/2000/svg" width="830" height="270" viewBox="0 0 830 270" role="img" aria-label="Joel Smith M — AI &amp; Data Science Engineer">
<title>Joel Smith M — AI &amp; Data Science Engineer</title>
<defs>
