<svg xmlns="http://www.w3.org/2000/svg" width="830" height="250" viewBox="0 0 830 250" role="img" aria-label="About Joel">
<title>About Joel</title>
<defs>
  <radialGradient id="glowP"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".26"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowT"><stop offset="0" stop-color="#14b8a6" stop-opacity=".20"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/>
    <stop offset=".5" stop-color="#ffffff" stop-opacity=".07"/>
    <stop offset="1" stop-color="#14b8a6" stop-opacity=".45"/>
  </linearGradient>
  <linearGradient id="nameFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d3ff"/></linearGradient>
  <clipPath id="clip"><rect x=".5" y=".5" width="829" height="249" rx="18"/></clipPath>
</defs>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  @media (prefers-reduced-motion: reduce){ .pulse{animation:none!important} }
</style>
<rect x=".5" y=".5" width="829" height="249" rx="18" fill="#0b0f15"/>
<g clip-path="url(#clip)">
  <circle cx="100" cy="5" r="332" fill="url(#glowP)"></circle>
  <circle cx="764" cy="245" r="299" fill="url(#glowT)"></circle>
</g>
<rect x=".5" y=".5" width="829" height="249" rx="18" fill="none" stroke="url(#bd)"/>
<text x="44" y="62" font-size="22" font-weight="700" letter-spacing="-.3" fill="#e6edf3">Building intelligent systems at the intersection of</text>
<text x="44" y="92" font-size="22" font-weight="700" letter-spacing="-.3" fill="#e6edf3">machine learning, backend engineering and real-world impact.</text>
<text x="44" y="128" font-size="13" fill="#8b95a3">AI &amp; Data Science engineer who ships end to end — NLP pipelines and REST backends in</text>
<text x="44" y="150" font-size="13" fill="#8b95a3">Python/FastAPI, React and Node front ends, and IoT hardware on Raspberry Pi. Currently</text>
<text x="44" y="172" font-size="13" fill="#8b95a3">going deeper into LLM fine-tuning, RAG pipelines and cloud-native AI deployment on AWS.</text>
<text class="mono" x="44" y="220" font-size="10.5" fill="#6b7683">B.Tech AI &amp; DS   ·   Karunya Institute   ·   Mindcraft Expo 3rd Prize   ·   SIH Round 2</text>
</svg>
