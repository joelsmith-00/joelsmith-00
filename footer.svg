<svg xmlns="http://www.w3.org/2000/svg" width="830" height="110" viewBox="0 0 830 110" role="img" aria-label="Footer">
<title>Footer</title>
<defs>
  <radialGradient id="glowP"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".26"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowT"><stop offset="0" stop-color="#14b8a6" stop-opacity=".20"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/>
    <stop offset=".5" stop-color="#ffffff" stop-opacity=".07"/>
    <stop offset="1" stop-color="#14b8a6" stop-opacity=".45"/>
  </linearGradient>
  <linearGradient id="nameFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d3ff"/></linearGradient>
  <clipPath id="clip"><rect x=".5" y=".5" width="829" height="109" rx="18"/></clipPath>
</defs>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  @media (prefers-reduced-motion: reduce){ .pulse{animation:none!important} }
</style>
<rect x=".5" y=".5" width="829" height="109" rx="18" fill="#0b0f15"/>
<g clip-path="url(#clip)">
  <circle cx="100" cy="2" r="332" fill="url(#glowP)"><animate attributeName="opacity" values=".75;1;.75" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="764" cy="108" r="299" fill="url(#glowT)"><animate attributeName="opacity" values="1;.7;1" dur="9s" repeatCount="indefinite"/></circle>
</g>
<rect x=".5" y=".5" width="829" height="109" rx="18" fill="none" stroke="url(#bd)"/>
<text x="415.0" y="52" text-anchor="middle" font-size="15" font-style="italic" fill="#cbd5e1">Build AI that doesn't just compute — it understands.</text>
<circle cx="401.0" cy="82" r="2.6" fill="#8b5cf6"><animate attributeName="opacity" values=".35;1;.35" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle>
<circle cx="415.0" cy="82" r="2.6" fill="#2dd4bf"><animate attributeName="opacity" values=".35;1;.35" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
<circle cx="429.0" cy="82" r="2.6" fill="#8b5cf6"><animate attributeName="opacity" values=".35;1;.35" dur="3s" begin="1.0s" repeatCount="indefinite"/></circle>
</svg>
